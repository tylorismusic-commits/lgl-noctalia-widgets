<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
<!-- DualShock 4 illustration.
     inputs_card.luau replaces {{COLOR}}, {{BODY}}, {{BODY_OPACITY}},
     {{LIGHTBAR}} and {{STROKE_BODY}} and writes a generated copy into the
     plugin data directory. -->
<path d="M35 20
         C28 20 23 23 20 30
         C16 39 12 53 11.5 65
         C11 75 14.5 81 21 82
         C27 83 32 78 35 72
         C37 68 39 66 44 66
         H76
         C81 66 83 68 85 72
         C88 78 93 83 99 82
         C105.5 81 109 75 108.5 65
         C108 53 104 39 100 30
         C97 23 92 20 85 20 Z"
      fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}" stroke="{{COLOR}}" stroke-width="{{STROKE_BODY}}" stroke-linejoin="round"/>
<!-- light bar -->
<path d="M47 20.5 H73" stroke="{{LIGHTBAR}}" stroke-width="2.6" stroke-linecap="round"/>
<!-- touchpad -->
<rect x="44" y="23" width="32" height="18" rx="3" fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}" stroke="{{COLOR}}" stroke-width="1.5"/>
<path d="M47 27.5 H73" stroke="{{COLOR}}" stroke-width="1" stroke-opacity="0.45"/>
<g fill="none" stroke="{{COLOR}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- d-pad -->
  <path d="M31.5 29 h5 v4.5 h4.5 v6 h-4.5 v4.5 h-5 v-4.5 h-4.5 v-6 h4.5 z" fill="{{BODY}}" fill-opacity="{{BODY_OPACITY}}"/>
  <!-- face buttons -->
  <path d="M86 25.5 L90 32.5 H82 Z" stroke="#6fe3a2"/>
  <circle cx="93" cy="36" r="4" stroke="#ff7a90"/>
  <path d="M83 39.5 l6 6 M89 39.5 l-6 6" stroke="#8ab4ff"/>
  <rect x="75.5" y="32.5" width="7.2" height="7.2" rx="1" stroke="#ff9ad5"/>
  <!-- left / right stick -->
  <circle cx="39" cy="53" r="10"/>
  <circle cx="39" cy="53" r="4.6" stroke-width="1.2" stroke-opacity="0.8"/>
  <circle cx="81" cy="53" r="10"/>
  <circle cx="81" cy="53" r="4.6" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- PS button -->
  <circle cx="60" cy="47" r="3.4"/>
  <circle cx="60" cy="47" r="1.1" fill="{{COLOR}}" stroke="none" fill-opacity="0.8"/>
  <!-- share / options -->
  <rect x="48.5" y="44" width="4" height="2.2" rx="1.1" stroke-width="1.1"/>
  <rect x="67.5" y="44" width="4" height="2.2" rx="1.1" stroke-width="1.1"/>
</g>
</svg>
