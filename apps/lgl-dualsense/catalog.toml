# Index for using this directory as a Noctalia plugin source:
#   noctalia msg plugins source add dualsense path /path/to/lgl-noctalia-widgets/apps/lgl-dualsense
# The per-plugin plugin.toml stays authoritative.

[[plugin]]
id           = "deadYokai/dualsense"
name         = "Gamepad Display"
version      = "1.2.0"
author       = "deadYokai"
license      = "MIT"
icon         = "device-gamepad-2"
description  = "Live controller artwork, buttons, sticks, triggers, D-pad and battery for DualSense, DualShock 4, 8BitDo and XInput pads."
deprecated   = false
plugin_api   = 17
tags         = ["gaming", "hardware", "battery", "dualsense", "dualshock", "8bitdo", "input", "desktop"]
dependencies = ["python3"]
